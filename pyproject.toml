[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-mark-xxxix"
version = "0.1.0"
description = "JARVIS local Gemini Live desktop assistant"
requires-python = ">=3.11"

[project.scripts]
jarvis = "main:cli_main"

[tool.setuptools]
py-modules = ["main", "ui"]

[tool.setuptools.packages.find]
include = ["actions*", "agent*", "api*", "awareness*", "audio*", "config*", "core*", "llm_providers*", "memory*", "observability*", "tools*", "plugins*"]
